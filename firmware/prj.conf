# =========================================================
# Basic console / printk
# =========================================================
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
#CONFIG_UART_CONSOLE=y


# =========================================================
# Native USB CDC ACM console
# =========================================================
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="NanoStat nPM1300 bringup"

# The Nordic VID suppresses the default test-VID warning during development.
# A released product must use a legally assigned USB VID/PID.
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x0004

# USB is enabled explicitly in main.c with usb_enable(NULL).
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Required by the CDC ACM console.
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y


# =========================================================
# nPM1300 / I2C / Sensor
# =========================================================
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LED=y
CONFIG_LED_NPM1300=y
CONFIG_MFD_NPM1300=y
CONFIG_NPM1300_CHARGER=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM1300=y
CONFIG_SPI=y
CONFIG_SPI_NRFX=y


# =========================================================
# Logging
# =========================================================
# Disable the Zephyr logging subsystem and retain printk output only.
CONFIG_LOG=n


# =========================================================
# Shell
# =========================================================
# Disable the shell so its prompt does not mix with periodic printk output.
CONFIG_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_I2C_SHELL=n
CONFIG_SENSOR_SHELL=n


# =========================================================
# Low frequency clock
# =========================================================
# Use the internal 32.768 kHz RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Enable automatic RC calibration.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=4000

# Declare the low-frequency clock accuracy.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y



CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n


# =========================================================
# BLE / Nordic UART Service
# =========================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NanoStat"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_NUS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_SETTINGS=n
